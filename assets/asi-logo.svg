<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- outer orbit ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 10" opacity="0.7"/>

  <!-- device nodes on orbit -->
  <g fill="url(#core)" opacity="0.9">
    <circle cx="256" cy="60" r="10"/>
    <circle cx="452" cy="256" r="10"/>
    <circle cx="256" cy="452" r="10"/>
    <circle cx="60" cy="256" r="10"/>
  </g>

  <!-- connection lines to core -->
  <g stroke="url(#core)" stroke-width="2.5" opacity="0.45" stroke-linecap="round">
    <line x1="256" y1="60" x2="256" y2="150"/>
    <line x1="452" y1="256" x2="362" y2="256"/>
    <line x1="256" y1="452" x2="256" y2="362"/>
    <line x1="60" y1="256" x2="150" y2="256"/>
  </g>

  <!-- glow -->
  <circle cx="256" cy="256" r="120" fill="url(#glow)"/>

  <!-- core orb -->
  <circle cx="256" cy="256" r="86" fill="url(#core)"/>
  <circle cx="256" cy="256" r="86" fill="none" stroke="#e0f2fe" stroke-opacity="0.35" stroke-width="2"/>

  <!-- inner nucleus -->
  <circle cx="256" cy="256" r="30" fill="#0f172a" opacity="0.9" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="18" fill="#f0f9ff"/>

  <!-- orbiting dot accent -->
  <circle cx="452" cy="256" r="4" fill="#f0f9ff"/>
</svg>
