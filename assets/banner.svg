<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e2e8f0">
    <circle cx="120" cy="60" r="1.6" opacity="0.7"/><circle cx="340" cy="40" r="1.2" opacity="0.5"/>
    <circle cx="560" cy="80" r="1.8" opacity="0.8"/><circle cx="780" cy="50" r="1.3" opacity="0.5"/>
    <circle cx="1010" cy="70" r="1.6" opacity="0.7"/><circle cx="1140" cy="120" r="1.2" opacity="0.5"/>
    <circle cx="220" cy="140" r="1.1" opacity="0.4"/><circle cx="640" cy="130" r="1.4" opacity="0.6"/>
    <circle cx="920" cy="150" r="1.1" opacity="0.4"/><circle cx="60" cy="200" r="1.3" opacity="0.5"/>
    <circle cx="1080" cy="220" r="1.4" opacity="0.5"/><circle cx="460" cy="170" r="1" opacity="0.4"/>
  </g>

  <!-- ground glow -->
  <ellipse cx="600" cy="370" rx="420" ry="26" fill="#38bdf8" opacity="0.08"/>

  <!-- central beam -->
  <path d="M600 400 L470 170 L730 170 Z" fill="url(#beam)" opacity="0.35"/>

  <!-- core orb -->
  <circle cx="600" cy="170" r="62" fill="url(#core2)"/>
  <circle cx="600" cy="170" r="62" fill="none" stroke="#e0f2fe" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="600" cy="170" r="22" fill="#0f172a" opacity="0.85"/>
  <circle cx="600" cy="170" r="12" fill="#f0f9ff"/>

  <!-- orbit ring -->
  <ellipse cx="600" cy="170" rx="150" ry="46" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8" transform="rotate(-12 600 170)"/>

  <!-- device silhouettes -->
  <g>
    <!-- phone left -->
    <rect x="230" y="230" width="70" height="120" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="242" y="250" width="46" height="6" rx="3" fill="#38bdf8" opacity="0.8"/>
    <rect x="242" y="268" width="34" height="6" rx="3" fill="#64748b"/>
    <rect x="242" y="284" width="40" height="6" rx="3" fill="#64748b"/>
    <rect x="242" y="300" width="28" height="6" rx="3" fill="#64748b"/>
    <!-- desktop right -->
    <rect x="900" y="220" width="130" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="912" y="232" width="70" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="912" y="250" width="100" height="6" rx="3" fill="#64748b"/>
    <rect x="912" y="264" width="88" height="6" rx="3" fill="#64748b"/>
    <rect x="912" y="278" width="60" height="6" rx="3" fill="#64748b"/>
    <rect x="958" y="305" width="14" height="40" fill="#334155"/>
    <rect x="930" y="345" width="70" height="8" rx="4" fill="#334155"/>
    <!-- watch/badge -->
    <circle cx="830" cy="330" r="22" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="830" cy="330" r="8" fill="#818cf8" opacity="0.8"/>
  </g>

  <!-- connection arcs -->
  <g stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M300 290 Q600 380 900 290"/>
    <path d="M265 240 Q600 320 935 240" stroke-opacity="0.25"/>
  </g>

  <!-- particles -->
  <g fill="#7dd3fc">
    <circle cx="380" cy="140" r="3" opacity="0.8"/><circle cx="820" cy="120" r="2.5" opacity="0.7"/>
    <circle cx="700" cy="90" r="2" opacity="0.6"/><circle cx="480" cy="110" r="2.5" opacity="0.7"/>
  </g>
</svg>
